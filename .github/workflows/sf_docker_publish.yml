name: Create and Push Docker Image

on:
  push:
    branches:
      - release/firehose
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sei-images:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate docker tags/labels from github build context
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,enable=true
            type=raw,enable=${{ github.ref == 'refs/heads/release/firehose' }},value=develop
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.sf
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: sei-images
    runs-on: ubuntu-24.04

    permissions:
        contents: write

    steps:
      - name: Extract image
        id: image
        run: |
          version=${GITHUB_REF#refs/tags/}

          echo "ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${version}" >> "$GITHUB_OUTPUT"

      - name: Extract assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The --platform are not really needed here, but it removes the warning
          docker cp $(docker create --platform=linux/amd64 ${{ steps.image.outputs.ID }}):/app/seid ./seid_linux

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            ./seid_linux
